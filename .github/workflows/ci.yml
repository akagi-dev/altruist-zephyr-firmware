name: CI

on:
  push:
  pull_request:

jobs:
  zephyr:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Zephyr SDK + west workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: .
          toolchains: x86_64-zephyr-elf:riscv64-zephyr-elf:xtensa-espressif_esp32_zephyr-elf
          ccache-cache-key: v1-${{ runner.os }}-${{ github.ref_name }}

      - name: Export Zephyr CMake package
        run: west zephyr-export

      - name: Run Twister smoke tests
        run: west twister -T tests/smoke/native_sim -O twister-out

      - name: Build app for esp32c6_devkitc
        run: west build -p always -b esp32c6_devkitc app -d build-esp32c6

      - name: Upload Twister artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister-out-${{ github.run_id }}
          path: twister-out
          if-no-files-found: warn
